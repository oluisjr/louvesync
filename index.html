<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="louvesync-build" content="__LOUVESYNC_BUILD__" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link id="app-favicon" rel="icon" type="image/png" sizes="64x64" href="/brand/v2/favicon-light.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/v2/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#F5F0FF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LouveSync" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style>
      :root { --app-canvas: #F5F0FF; color-scheme: light; background: var(--app-canvas); color: #0F172A; }
      :root[data-theme="dark"] { --app-canvas: #0A0414; color-scheme: dark; color: #E2E8F0; }
      body { margin: 0; background: var(--app-canvas); }
    </style>
    <script>
      // Apply the saved theme before the first paint, including while updates load.
      document.documentElement.dataset.displayMode = navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches ? 'standalone' : 'browser';
      try {
        if (localStorage.getItem('ls_theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#0A0414';
        }
      } catch { /* Use the default light theme when storage is unavailable. */ }
      document.getElementById('app-favicon').href = document.documentElement.dataset.theme === 'dark' ? '/brand/v2/favicon-dark.png' : '/brand/v2/favicon-light.png';
    </script>
    <title>LouveSync · IMWAL</title>
    <meta name="description" content="Gestão de ministério de louvor — IMWAL" />
  </head>
  <body>
    <div id="root"><div style="padding:24px;display:flex;align-items:center;gap:12px"><img src="/brand/v2/mark-color.png" width="40" height="40" alt="" /><p role="status" style="font-family:sans-serif">Abrindo LouveSync…</p></div></div>
    <noscript>
      <strong>Este aplicativo requer JavaScript.</strong> Por favor, habilite o JavaScript para continuar.
    </noscript>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
